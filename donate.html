<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Donor</title>
    <link rel="stylesheet" href="donate.css">
</head>
<body>

    <div class="form-container">
        <h2>❤️ Become a Donor</h2>
        
        <form id="donorForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="number" id="age" placeholder="Age" min="18" max="65" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <input type="text" id="city" placeholder="City" required>

            <select id="group" required>
                <option value="" disabled selected>Select Blood Group</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
            </select>

            <label class="file-label">Upload Medical Certificate (Optional):</label>
            <input type="file" id="certificate" accept="image/*,.pdf">

            <button type="button" id="locBtn">📍 Get My Current Location</button>
            <p id="locStatus">Location not captured</p>

            <button type="submit">Register Now</button>
        </form>
        
        <button class="back-btn" onclick="window.location.href='home.html'">⬅ Back to Home</button>
    </div>

    <script>
        let myLat = null; let myLng = null;
        document.getElementById('locBtn').addEventListener('click', function() {
            const status = document.getElementById('locStatus');
            if (!navigator.geolocation) { status.textContent = "Geolocation not supported"; } 
            else {
                status.textContent = "Locating...";
                navigator.geolocation.getCurrentPosition(
                    (p) => { myLat = p.coords.latitude; myLng = p.coords.longitude; status.textContent = "✅ Location Captured!"; status.style.color = "green"; }, 
                    () => { status.textContent = "❌ Error getting location"; status.style.color = "red"; }
                );
            }
        });

        document.getElementById('donorForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!myLat || !myLng) { alert("Please click 'Get My Current Location' first!"); return; }

            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('age', document.getElementById('age').value);
            formData.append('phone', document.getElementById('phone').value);
            formData.append('city', document.getElementById('city').value);
            formData.append('group', document.getElementById('group').value);
            formData.append('lat', myLat);
            formData.append('lng', myLng);
            
            const fileInput = document.getElementById('certificate');
            if(fileInput.files[0]) { formData.append('certificate', fileInput.files[0]); }

            try {
                const response = await fetch('http://localhost:3000/donate', { method: 'POST', body: formData });
                if(response.ok) { alert('✅ Registered Successfully!'); window.location.href = "find.html"; } 
                else { alert(await response.text()); }
            } catch (error) { alert('⚠️ Server is offline!'); }
        });
    </script>
</body>
</html>
